  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen relative overflow-x-hidden selection:bg-primary selection:text-on-primary pt-safe pb-safe"><div class="fixed inset-0 pointer-events-none z-0 overflow-hidden"><div class="absolute -top-[10%] -left-[10%] w-[95vw] h-[95vw] rounded-full bg-secondary-container/25 blur-[140px]"></div><div class="absolute top-[40%] right-[-10%] w-[80vw] h-[80vw] rounded-full bg-primary-container/20 blur-[130px]"></div><div class="absolute -bottom-[15%] left-[20%] w-[90vw] h-[90vw] rounded-full bg-surface-container-high/50 blur-[140px]"></div></div><main class="flex flex-col relative w-full px-margin z-10 flex-1 bg-surface/20"><div class="flex flex-col w-full min-w-0 pb-space-lg select-none">
<!-- Dynamic Intensity / Mood Pill Selector -->
<div class="flex items-center justify-between mb-space-md pt-space-xs">
<div class="inline-flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container/60 backdrop-blur-xl shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-primary">Noche de confidencias</span>
</div>
<div class="flex items-center gap-1.5 p-1 rounded-full bg-surface-container-high/60 backdrop-blur-xl">
<button class="px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 bg-primary-container text-on-primary-container shadow-md" id="mode-suave" onclick="setMode('suave')">
        Suave
      </button>
<button class="px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 text-on-surface-variant hover:text-on-surface" id="mode-picante" onclick="setMode('picante')">
        Picante
      </button>
<button class="px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 text-on-surface-variant hover:text-on-surface" id="mode-extremo" onclick="setMode('extremo')">
        Extremo
      </button>
</div>
</div>
<!-- Hero Header -->
<header class="flex flex-col mb-space-lg">
<div class="flex items-baseline justify-between">
<h1 class="font-display-hero-mobile text-display-hero-mobile font-extrabold tracking-tight text-white drop-shadow-[0_4px_24px_rgba(255,255,255,0.22)]">
        Ronda
      </h1>
<span class="px-2.5 py-1 rounded-full bg-surface-container-highest/70 backdrop-blur-md font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">bolt</span>
        v2.4
      </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5 font-medium tracking-wide">
      Un teléfono, una mesa.
    </p>
</header>
<!-- Interactive Floating Liquid Glass Card Stack -->
<div class="relative w-full aspect-[4/5] max-h-[440px] flex items-center justify-center mb-space-lg cursor-pointer group" onclick="cycleCard()">
<!-- Deep Ambient Glow behind the deck -->
<div class="absolute inset-4 rounded-xl bg-primary-container/20 blur-2xl transition-all duration-500 pointer-events-none" id="deck-glow"></div>
<!-- Back Tertiary Card Silhouette -->
<div class="absolute w-[86%] h-[88%] -top-3 rounded-lg bg-surface-bright/20 backdrop-blur-md opacity-35 scale-[0.92] rotate-[5deg] transition-transform duration-500 group-hover:rotate-[7deg]"></div>
<!-- Mid Secondary Card Silhouette -->
<div class="absolute w-[93%] h-[94%] -top-1.5 rounded-lg bg-surface-bright/35 backdrop-blur-lg opacity-60 scale-[0.96] -rotate-[3deg] transition-transform duration-500 group-hover:-rotate-[4.5deg]"></div>
<!-- Foreground Primary Glass Card -->
<div class="relative w-full h-full rounded-lg p-space-lg flex flex-col justify-between overflow-hidden transition-all duration-300 transform active:scale-[0.98] shadow-2xl bg-gradient-to-br from-white/15 via-white/[0.05] to-transparent backdrop-blur-[32px] backdrop-saturate-[200%]" id="active-card">
<!-- Specular Refraction Rim (Simulated light sweep) -->
<div class="absolute inset-0 rounded-lg pointer-events-none bg-gradient-to-b from-white/30 via-transparent to-white/5 opacity-70"></div>
<!-- Glass Glare Accent Upper-Left -->
<div class="absolute -top-16 -left-16 w-36 h-36 rounded-full bg-white/20 blur-xl pointer-events-none"></div>
<!-- Top Row: Card Counter and Micro Action -->
<div class="relative z-10 flex items-center justify-between">
<div class="flex items-center gap-space-xs px-3 py-1 rounded-full bg-surface-container-lowest/40 backdrop-blur-md">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-white tracking-wider uppercase" id="card-tag">Cuestión #14</span>
</div>
<div class="flex items-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[18px]">touch_app</span>
<span>Toca para girar</span>
</div>
</div>
<!-- Card Core Prompt -->
<div class="relative z-10 my-auto py-space-sm">
<p class="font-headline-lg-mobile text-headline-lg-mobile text-white leading-snug font-bold drop-shadow-sm tracking-tight transition-opacity duration-200" id="card-question">
          ¿Qué cosa harías si supieras que nadie se va a enterar jamás?
        </p>
</div>
<!-- Bottom Card Metadata: Category Capsule and Level Indicator -->
<div class="relative z-10 flex items-end justify-between pt-space-md">
<!-- Capsule Pill -->
<div class="flex items-center gap-space-xs px-3.5 py-1.5 rounded-full bg-surface-container-lowest/50 backdrop-blur-xl shadow-inner" id="card-category-pill">
<span class="material-symbols-outlined text-[18px] text-primary" id="card-icon" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-md text-label-md font-semibold text-white" id="card-category">Verdad</span>
</div>
<!-- Social Proof micro indicator -->
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/[0.06] backdrop-blur-sm">
<span class="material-symbols-outlined text-[14px] text-tertiary">favorite</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">98% atrevidos</span>
</div>
</div>
</div>
</div>
<!-- Primary Action Container: Hero CTA Button -->
<div class="flex flex-col gap-space-md w-full">
<button class="group relative w-full h-14 rounded-full flex items-center justify-center gap-space-sm bg-gradient-to-r from-primary-fixed-dim via-primary-container to-primary font-label-lg text-label-lg text-on-primary-container font-bold shadow-[0_12px_36px_-6px_rgba(255,140,83,0.55),0_2px_8px_rgba(0,0,0,0.4)] transition-all duration-300 active:scale-[0.97] hover:shadow-[0_16px_40px_-4px_rgba(255,140,83,0.7)] overflow-hidden" onclick="startSession()">
<!-- Top Specular Interior Reflection Line -->
<span class="absolute inset-x-4 top-0.5 h-[1.5px] bg-gradient-to-r from-transparent via-white/80 to-transparent rounded-full opacity-70"></span>
<span class="material-symbols-outlined text-[24px] text-on-primary-container transition-transform duration-300 group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="tracking-wide">Nueva partida</span>
</button>
<!-- Bottom Secondary Actions: Three Ergonomic Glass Pills -->
<div class="grid grid-cols-3 gap-space-sm w-full">
<!-- Option 1: Modo Cita -->
<button class="h-13 py-3 px-2 rounded-full flex items-center justify-center gap-1.5 bg-surface-bright/25 hover:bg-surface-bright/40 active:bg-surface-bright/50 backdrop-blur-2xl shadow-sm transition-all duration-200 active:scale-[0.96] text-white" onclick="selectCategory('cita')">
<span class="material-symbols-outlined text-[19px] text-tertiary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-label-md text-label-md font-semibold truncate">Cita</span>
</button>
<!-- Option 2: Mis Cartas / Decks -->
<button class="h-13 py-3 px-2 rounded-full flex items-center justify-center gap-1.5 bg-surface-bright/25 hover:bg-surface-bright/40 active:bg-surface-bright/50 backdrop-blur-2xl shadow-sm transition-all duration-200 active:scale-[0.96] text-white" onclick="selectCategory('cartas')">
<span class="material-symbols-outlined text-[19px] text-primary" style="font-variation-settings: 'FILL' 1;">style</span>
<span class="font-label-md text-label-md font-semibold truncate">Mis cartas</span>
</button>
<!-- Option 3: Ajustes -->
<button class="h-13 py-3 px-2 rounded-full flex items-center justify-center gap-1.5 bg-surface-bright/25 hover:bg-surface-bright/40 active:bg-surface-bright/50 backdrop-blur-2xl shadow-sm transition-all duration-200 active:scale-[0.96] text-white" onclick="selectCategory('ajustes')">
<span class="material-symbols-outlined text-[19px] text-on-surface-variant">tune</span>
<span class="font-label-md text-label-md font-semibold truncate">Ajustes</span>
</button>
</div>
</div>
<!-- Compact Community Stats Floating Pill -->
<div class="mt-space-lg flex items-center justify-center gap-space-xs text-center py-2 px-4 rounded-full bg-surface-container-low/40 backdrop-blur-md self-center">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
<p class="font-label-sm text-label-sm text-on-surface-variant">
      Más de <span class="text-on-surface font-semibold">120.000 rondas</span> jugadas esta semana
    </p>
</div>
</div>
<script>
  const cards = [
    {
      q: "¿Qué cosa harías si supieras que nadie se va a enterar jamás?",
      category: "Verdad",
      icon: "verified",
      tag: "Cuestión #14",
      mode: "suave"
    },
    {
      q: "Confiesa cuál es tu peor hábito cuando estás completamente a solas.",
      category: "Confesión",
      icon: "visibility_off",
      tag: "Cuestión #27",
      mode: "picante"
    },
    {
      q: "¿A quién de esta mesa llamarías primero si te arrestaran a las 4 AM?",
      category: "Dilema",
      icon: "group",
      tag: "Cuestión #09",
      mode: "suave"
    },
    {
      q: "Deja que la persona a tu derecha revise tus fotos eliminadas durante 30 segundos.",
      category: "Reto",
      icon: "local_fire_department",
      tag: "Cuestión #52",
      mode: "extremo"
    }
  ];

  let currentCardIndex = 0;

  function cycleCard() {
    const cardEl = document.getElementById('active-card');
    const questionEl = document.getElementById('card-question');
    const catEl = document.getElementById('card-category');
    const iconEl = document.getElementById('card-icon');
    const tagEl = document.getElementById('card-tag');

    questionEl.style.opacity = '0';
    
    setTimeout(() => {
      currentCardIndex = (currentCardIndex + 1) % cards.length;
      const card = cards[currentCardIndex];
      questionEl.innerText = card.q;
      catEl.innerText = card.category;
      iconEl.innerText = card.icon;
      tagEl.innerText = card.tag;
      questionEl.style.opacity = '1';
    }, 180);
  }

  function setMode(mode) {
    const modes = ['suave', 'picante', 'extremo'];
    modes.forEach(m => {
      const btn = document.getElementById('mode-' + m);
      if (m === mode) {
        if (m === 'suave') {
          btn.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 bg-primary-container text-on-primary-container shadow-md";
        } else if (m === 'picante') {
          btn.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 bg-secondary-container text-on-secondary-container shadow-md";
        } else {
          btn.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 bg-tertiary text-on-tertiary shadow-md";
        }
      } else {
        btn.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-300 text-on-surface-variant hover:text-on-surface";
      }
    });

    const glow = document.getElementById('deck-glow');
    if (mode === 'suave') {
      glow.className = "absolute inset-4 rounded-xl bg-primary-container/20 blur-2xl transition-all duration-500 pointer-events-none";
    } else if (mode === 'picante') {
      glow.className = "absolute inset-4 rounded-xl bg-secondary-container/25 blur-2xl transition-all duration-500 pointer-events-none";
    } else {
      glow.className = "absolute inset-4 rounded-xl bg-tertiary-container/30 blur-2xl transition-all duration-500 pointer-events-none";
    }
  }

  function startSession() {
    const cardEl = document.getElementById('active-card');
    cardEl.classList.add('scale-95');
    setTimeout(() => {
      cardEl.classList.remove('scale-95');
      cycleCard();
    }, 140);
  }

  function selectCategory(cat) {
    console.log('Category selected:', cat);
  }
</script></main></body></html>
