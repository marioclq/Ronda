<script>
  function handleDynamicSelect(mode) {
    const toast = document.getElementById('action-toast');
    const toastText = document.getElementById('toast-text');
    
    const messages = {
      verdad: 'Cargando confesión para Beto...',
      azar: 'La botella cósmica está girando...',
      reto: 'Desafío extremo en camino...'
    };

    if (toast && toastText) {
      toastText.textContent = messages[mode] || 'Procesando...';
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      // Vibrate if browser supports it for physical game feel
      if (navigator.vibrate) {
        navigator.vibrate(mode === 'azar' ? [30, 40, 50] : 35);
      }

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 1600);
    }
  }

  function handlePassTurn() {
    const playerEl = document.getElementById('current-player');
    const names = ['Sofía', 'Mateo', 'Valentina', 'Beto', 'Camila'];
    if (playerEl) {
      const current = playerEl.textContent.trim();
      const currentIndex = names.indexOf(current);
      const nextName = names[(currentIndex + 1) % names.length];
      
      playerEl.style.transform = 'translateY(-6px)';
      playerEl.style.opacity = '0';
      
      setTimeout(() => {
        playerEl.textContent = nextName;
        playerEl.style.transform = 'translateY(0)';
        playerEl.style.opacity = '1';
      }, 180);
    }
  }
