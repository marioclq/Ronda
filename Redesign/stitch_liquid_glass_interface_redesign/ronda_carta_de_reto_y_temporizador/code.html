<script>
  let timerSeconds = 28;
  const totalSeconds = 30;
  let isTimerRunning = true;
  const circumference = 314.159;

  const timerValElem = document.getElementById('countdown-val');
  const timerProgress = document.getElementById('timer-progress');
  const toggleBtnText = document.getElementById('timer-btn-text');
  const toggleIcon = document.getElementById('timer-icon');

  function updateTimerCircle() {
    if (!timerProgress) return;
    const progress = timerSeconds / totalSeconds;
    const offset = circumference - (progress * circumference);
    timerProgress.style.strokeDashoffset = offset;
  }

  const interval = setInterval(() => {
    if (!isTimerRunning) return;
    if (timerSeconds > 0) {
      timerSeconds--;
      if (timerValElem) timerValElem.innerText = timerSeconds < 10 ? '0' + timerSeconds : timerSeconds;
      updateTimerCircle();
    } else {
      clearInterval(interval);
      if (timerValElem) timerValElem.innerText = '00';
      if (timerProgress) timerProgress.style.stroke = '#ffb4ab';
    }
  }, 1000);

  function toggleTimer() {
    isTimerRunning = !isTimerRunning;
    if (toggleBtnText && toggleIcon) {
      if (isTimerRunning) {
        toggleBtnText.innerText = 'Pausar cuenta';
        toggleIcon.innerText = 'pause';
      } else {
        toggleBtnText.innerText = 'Reanudar';
        toggleIcon.innerText = 'play_arrow';
      }
    }
  }

  function handleComplete() {
    const btn = event.currentTarget;
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
    }, 150);
  }

  function handlePass() {
    const btn = event.currentTarget;
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
    }, 150);
  }

  function handleDrawOther() {
    timerSeconds = 30;
    if (timerValElem) timerValElem.innerText = '30';
    updateTimerCircle();
  }
</script></main></body></html>
